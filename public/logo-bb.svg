<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient for 3D effect -->
  <defs>
    <linearGradient id="gradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B4F6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#147A8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A3A4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17A2B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#20C997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138496;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left B -->
  <g id="leftB">
    <!-- Outer frame left -->
    <rect x="30" y="40" width="35" height="120" fill="url(#gradientDark)" stroke="#0B4F6B" stroke-width="2" rx="4"/>
    <!-- Inner cutout -->
    <rect x="38" y="50" width="15" height="100" fill="white" rx="2"/>
    <!-- Top right extension -->
    <rect x="60" y="40" width="25" height="35" fill="url(#gradientLight)" stroke="#138496" stroke-width="2" rx="2"/>
    <!-- Bottom right extension -->
    <rect x="60" y="125" width="25" height="35" fill="url(#gradientLight)" stroke="#138496" stroke-width="2" rx="2"/>
  </g>
  
  <!-- Right B (mirrored and offset) -->
  <g id="rightB" transform="translate(85, 0)">
    <!-- Outer frame right -->
    <rect x="30" y="40" width="35" height="120" fill="url(#gradientDark)" stroke="#0B4F6B" stroke-width="2" rx="4"/>
    <!-- Inner cutout -->
    <rect x="38" y="50" width="15" height="100" fill="white" rx="2"/>
    <!-- Top left extension -->
    <rect x="5" y="40" width="25" height="35" fill="url(#gradientLight)" stroke="#138496" stroke-width="2" rx="2"/>
    <!-- Bottom left extension -->
    <rect x="5" y="125" width="25" height="35" fill="url(#gradientLight)" stroke="#138496" stroke-width="2" rx="2"/>
  </g>
  
  <!-- Center accent square -->
  <rect x="92" y="85" width="16" height="16" fill="#17A2B8" stroke="#0B4F6B" stroke-width="1.5" rx="2"/>
</svg>
